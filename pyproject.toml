[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badking"
version = "0.2.0"
description = "BADKING - all-in-one, AI-native framework for Bale (بله) bots. Superset of aiobale."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "badking-daniyal", email = "d099173878@gmail.com" }]
keywords = ["bale", "بله", "bot", "framework", "asyncio", "aiogram", "persian", "iran"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "eval_type_backport>=0.2; python_version<'3.10'",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
mongo = ["motor>=3.4"]
sqlite = []
ai = ["openai>=1.30"]
hybrid = ["websockets>=12.0"]
all = ["redis>=5.0", "asyncpg>=0.29", "websockets>=12.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
badking = "badking.cli.main:main"

[project.urls]
Homepage = "https://badking.ir"
Documentation = "https://docs.badking.ir"
Repository = "https://github.com/badking-daniyal/badking"
Issues = "https://github.com/badking-daniyal/badking/issues"
Changelog = "https://github.com/badking-daniyal/badking/blob/main/docs/roadmap.md"

[tool.setuptools.packages.find]
include = ["badking*"]

[tool.setuptools.package-data]
"badking.hybrid" = ["README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
