[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
asyncio_mode = auto
filterwarnings =
    error::DeprecationWarning:badking.*
    default
markers =
    slow: تست‌های کندتر از یک ثانیه
    network: به شبکه نیاز دارد (در CI رد می‌شود)
    integration: چند ماژول با هم
    live: تست زنده با حساب آزمایشی (پیشفرض SKIP)
